[project]
name = "julienne"
version = "0.1.0"
description = "An integration engine built in python on celery."
authors = [{ name = "PattyC", email = "patrickcoffey91@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = [
    "celery[msgpack, redis, auth]>=5.2.7,<6",
    "pydantic>=1.10.2,<2",
    "flower>=1.2.0,<2",
]

[dependency-groups]
test = [
    "pytest>=7.3.1,<8",
    "pytest-cov>=4.1.0,<5",
    "pytest-sugar>=0.9.7,<0.10",
]

[tool.uv]
default-groups = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=julienne --cov-report term-missing"
