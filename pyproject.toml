[project]
name = "julienne"
version = "0.1.0"
description = "An integration engine built in python on celery."
authors = [{ name = "PattyC", email = "patrickcoffey91@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = [
    "celery[msgpack, redis, auth]>=5.2.7,<6",
    "pydantic>=1.10.2,<2",
    "flower>=1.2.0,<2",
]

[dependency-groups]
test = [
    "pytest>=7.3.1,<8",
    "pytest-cov>=4.1.0,<5",
    "pytest-sugar>=0.9.7,<0.10",
]
dev = [
    "ruff>=0.6,<0.7",
    "pre-commit>=3.8,<4",
]

[tool.uv]
default-groups = ["test", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=julienne --cov-report term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


